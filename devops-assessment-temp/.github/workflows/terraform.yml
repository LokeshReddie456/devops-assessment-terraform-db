name: "Terraform CI"

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Generate Terraform Plan
        id: plan
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock_access_key
          AWS_SECRET_ACCESS_KEY: mock_secret_key
        run: |
          terraform plan -refresh=false -no-color -out=tfplan.binary > plan.txt
          echo "PLAN_EXIT_CODE=$?" >> $GITHUB_ENV
          cat plan.txt

      - name: Post Plan to Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'infra/envs/${{ matrix.environment }}/plan.txt';
            let planOutput = 'No plan output generated.';
            if (fs.existsSync(path)) {
              planOutput = fs.readFileSync(path, 'utf8');
            }
            const maxLen = 60000;
            if (planOutput.length > maxLen) {
              planOutput = planOutput.substring(0, maxLen) + '\n\n... [Output Truncated]';
            }

            const body = `#### Environment: \`${{ matrix.environment }}\`
            #### Terraform Format & Style: 🖌\`Success\`
            #### Terraform Initialization: ⚙️\`Success\`
            #### Terraform Validation: 🤖\`Success\`
            #### Terraform Plan: 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan (${{ matrix.environment }})</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
